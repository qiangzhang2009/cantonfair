name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r cantonfair_system/requirements.txt

      - name: Build Docker image
        run: |
          cd cantonfair_system
          docker build -t cantonfair-pro:${{ github.sha }} .

      - name: Deploy to Railway
        uses: buildtomorrow/railway-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: cantonfair-pro
          environment: production
          dockerfile: ./cantonfair_system/Dockerfile
          docker_context: ./cantonfair_system
