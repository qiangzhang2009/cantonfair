name: CI - Data Layer Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-data-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r cantonfair_system/requirements.txt
      - name: Verify data loader syntax
        run: |
          cd cantonfair_system
          python -c "import data.data_loader; print('data_loader syntax OK')"
